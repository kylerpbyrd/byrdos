name: OWASP ZAP Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (must be reachable from GitHub Actions runners)'
        required: true
        default: 'https://<your-staging-host>'
  # Weekly schedule is commented out until a stable staging host is deployed.
  # Once staging is available, uncomment the block below to run ZAP every Monday at 03:00 UTC.
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: This action is manually triggered until a staging host is available.
      # It requires a reachable target; running against localhost will fail.
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ github.event.inputs.target_url }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_issue_writing: false
          # rules_file_name: '.zap/rules.tsv'
