name: Deploy

on:
  push:
    branches: [main]
  tags:
    - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      suffix: ${{ steps.env.outputs.suffix }}
    steps:
      - name: Determine environment
        id: env
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "suffix=-staging" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    needs: [configure]
    environment: ${{ needs.configure.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build db package
        run: pnpm --filter @byrdos/db build

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: pnpm --filter @byrdos/db db:migrate

  deploy:
    name: Deploy ${{ matrix.service.name }} (${{ needs.configure.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [migrate, configure]
    if: needs.migrate.result == 'success'
    environment: ${{ needs.configure.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
          - name: sync-worker
          - name: webhook-worker
          - name: scheduler
          - name: outbox-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config "deploy/fly/${{ matrix.service.name }}.toml" \
            --app "byrdos-${{ matrix.service.name }}${{ needs.configure.outputs.suffix }}"

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [migrate, deploy]
    if: failure()
    steps:
      - name: Post Slack alert
        shell: bash
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"byrdOS deploy failed for `${{ github.ref_name }}`. Workflow: ${{ github.workflow }} / Run: ${{ github.run_id }}"}' \
            "${{ secrets.ALERT_WEBHOOK_URL }}"
