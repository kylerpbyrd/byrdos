# OpenTelemetry Collector configuration for byrdOS.
#
# Receivers:
#   - OTLP/gRPC on :4317
#   - OTLP/HTTP on :4318
#
# Processors:
#   - batch
#
# Exporters:
#   - prometheus (scrape endpoint on :9464)
#   - debug (console output; useful for local development)
#
# Pipelines:
#   - traces: otlp -> batch -> debug
#   - metrics: otlp -> batch -> prometheus
#
# Services should set:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<collector-host>:4318

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: byrdos
    const_labels:
      source: otel-collector
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
